[workspace]
authors = ["esemsc-htn223 <htn223@ic.ac.uk>"]
channels = ["conda-forge"]
name = "eddy-cov"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.5,<3.15"
marimo = ">=0.23.9,<0.24"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.10.9,<4"
altair = ">=6.1.0,<7"
geopandas = ">=1.1.3,<2"
requests = ">=2.34.2,<3"
openpyxl = ">=3.1.5,<4"
pandas = ">=3.0.3,<4"

[pypi-dependencies]
fluxnet-shuttle = { git = "https://github.com/fluxnet/shuttle.git" }
icoscp = ">=0.2.3, <0.3"

[feature.convert.pypi-dependencies]
#bico = { git = "https://github.com/holukas/bico.git" }  # bico is terribly outdated and has no osx-arm64 wheels, so we can't use it for now. We can add it back in when it is updated.

[feature.convert.dependencies]
python = "*"

[environments]
default = { solve-group = "default" }
convert = {features = ["convert"], no-default-feature = true}
